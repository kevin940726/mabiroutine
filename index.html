    <style>
      /* Boot splash: paints with the HTML itself, before the JS bundle (and
         its stylesheet) downloads — this is what covers the white gap on
         update launches, when #root sits empty awaiting the new chunk.
         Theme-aware via the .dark class set below; React fades it out on
         first commit (fade masks any hex seam with the app background). */
      html, body { margin: 0; padding: 0; }
      body { background: #ffffff; }
      html.dark body { background: #101012; }
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #ffffff;
        transition: opacity 0.22s ease;
      }
      /* Shown only for installed-PWA launches (script below) — browser tabs
         keep the normal loading behavior. */
      #boot-splash.boot-show { display: flex; }
      html.dark #boot-splash { background: #101012; }
      #boot-splash.boot-hide { opacity: 0; pointer-events: none; }
      #boot-splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 30px rgba(0,0,0,.18); }
      #boot-splash .boot-name {
        font: 600 15px/1.2 -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
        letter-spacing: .14em; color: #64748b;
      }
      html.dark #boot-splash .boot-name { color: #94a3b8; }
      /* Delayed liveness signal: the splash stays static like a real launch
         screen, but update launches can keep it up for seconds while the new
         chunk downloads — the spinner fades in only if we're still here
         after 1.5s, so fast launches never see it. */
      #boot-splash .boot-spin {
        width: 26px; height: 26px; border-radius: 50%;
        border: 3px solid rgba(100,116,139,.25); border-top-color: #10b981;
        opacity: 0;
        animation:
          boot-spin-in 0.3s ease 1.5s forwards,
          boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin-in { to { opacity: 1; } }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash { transition: none; }
        #boot-splash .boot-spin { animation: none; }
      }
    </style>
    <script>
      // Pre-paint theme: same logic as ThemeToggle (stored "theme", else OS
      // preference) so splash and first React paint share one background —
      // no white flash, no theme pop. Private-mode failures fall back to
      // light; normal boot covers.
      try {
        var __t = localStorage.getItem("theme");
        var __dark = __t ? __t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (__dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <title>MabiRoutine — 瑪奇 Mobile 日課・週課・以物易物</title>

  <body>
    <div id="boot-splash" aria-hidden="true">
      <img src="/icon-192.png" width="96" height="96" alt="" fetchpriority="high" />
      <div class="boot-name">MABIROUTINE</div>
      <div class="boot-spin"></div>
    </div>
    <script>
      // Standalone only: the splash is for installed-PWA launches (incl.
      // update launches) — browser tabs keep the normal loading behavior.
      // Runs synchronously here so the splash (above) shows before first
      // paint; anything unexpected removes it (fail invisible).
      try {
        var __std = window.matchMedia("(display-mode: standalone)").matches ||
          (typeof navigator.standalone === "boolean" && navigator.standalone);
        var __sp = document.getElementById("boot-splash");
        if (__sp) {
          if (__std) __sp.classList.add("boot-show");
          else __sp.remove();
        }
      } catch (e) {
        var __sp2 = document.getElementById("boot-splash");
        if (__sp2) __sp2.remove();
      }
    </script>
    <div id="root"></div>
    <script>
      // Boot preload: fire the session GET before the module graph (React +
      // app chunk) even loads, so the network round trip overlaps JS
      // bootstrap instead of waiting behind it. The app consumes this once
      // via takePreloaded (id-matched, 60s TTL); anything unexpected
      // (offline, id mismatch, non-OK) falls back to the normal pull path.
      // Early-read safety is free: the pull folds its acknowledged push over
      // whatever this returns, so a pre-flush response can't resurrect
      // anything. No SW interference: /api/* matches no runtimeCaching route.
      (function () {
        try {
          var m = /[?&]s=([0-9a-f-]{36})/i.exec(location.search);
          var id = m && m[1];
          if (!id) {
            var raw = localStorage.getItem("mabiroutine:session");
            var parsed = raw && JSON.parse(raw);
            if (parsed && typeof parsed.id === "string") id = parsed.id;
          }
          if (
            id &&
            /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id) &&
            navigator.onLine !== false
          ) {
            window.__mabiPreload = {
              id: id,
              at: Date.now(),
              res: fetch("/api/session?id=" + encodeURIComponent(id), { cache: "no-store" })
                .then(function (r) { return r.ok ? r.json() : null; })
                .catch(function () { return null; }),
            };
          }
        } catch (e) { /* private mode / blocked storage — normal boot covers */ }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
