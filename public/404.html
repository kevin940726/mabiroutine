<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>找不到頁面 — MabiRoutine</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #ffffff;
        color: #0f172a;
        font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #101012; color: #e2e8f0; }
        p { color: #94a3b8; }
      }
      main { max-width: 28rem; padding: 2rem; text-align: center; }
      img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 30px rgba(0, 0, 0, .18); }
      h1 { font-size: 1.5rem; margin: 1.25rem 0 .5rem; }
      p { margin: 0; color: #64748b; line-height: 1.6; }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        padding: .65rem 1.1rem;
        border-radius: .75rem;
        background: #10b981;
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
      }
      a:focus-visible { outline: 2px solid #10b981; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" width="96" height="96" alt="" />
      <h1>找不到這個頁面</h1>
      <p>網址可能打錯了，或這個頁面已經不存在。</p>
      <a href="/">回到 MabiRoutine</a>
    </main>
  </body>
</html>
